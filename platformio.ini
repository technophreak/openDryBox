; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:esp32s3box_arduino]
platform = espressif32
board = esp32s3box
framework = arduino
lib_deps = 
	pedroalbuquerque/ESP32WebServer @ ^1.0
	bblanchon/ArduinoJson @ ^7.4.2
	robtillaart/DHTNEW @ ^0.5.4
monitor_speed = 921600

; Change the following section below accordingly

;   For OTA updates (Disable serial Section)
;upload_port = 192.168.88.214
;upload_protocol = espota
;upload_flags = --auth=pl@tformi0
;monitor_port = COM4

;   For serial updates over USB (Disable OTA Section)
upload_port = COM4
monitor_port = COM4